<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>CactoLog · Offline Plant Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="Modern offline-first PWA for tracking plants: watering, repotting, photos, reminders. Production-ready v2.0.">
</head>
<body>
  <!-- App Header -->
  <header class="app-header">
    <button id="menuBtn" class="icon-btn" aria-label="Open navigation" title="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/>
      </svg>
    </button>

    <h1 class="brand">🌵 CactoLog</h1>

    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme" title="Theme">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1zm0 14a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm9-5a1 1 0 0 1-1 1h-2a1 1 0 1 1 0-2h2a1 1 0 0 1 1 1zM6 12a1 1 0 0 1-1 1H3a1 1 0 1 1 0-2h2a1 1 0 0 1 1 1z"/>
        </svg>
      </button>
      <button id="installBtn" class="primary-btn small" hidden>Install</button>
    </div>
  </header>

  <!-- Navigation Drawer -->
  <nav id="drawer" class="drawer" aria-label="Primary">
    <div class="drawer-header">
      <div class="logo">
        <img src="icons/icon-192.png" alt="" width="36" height="36">
        <span>CactoLog v2.0</span>
      </div>
      <button class="icon-btn" id="closeDrawer" aria-label="Close menu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.3 9.17 12 2.88 5.71 4.29 4.3l6.3 6.3 6.29-6.3z"/>
        </svg>
      </button>
    </div>

    <ul>
      <li><a href="#/dashboard" data-route>📊 Dashboard</a></li>
      <li><a href="#/plants" data-route>🌿 Plants</a></li>
      <li><a href="#/calendar" data-route>📅 Calendar</a></li>
      <li><a href="#/settings" data-route>⚙️ Settings</a></li>
    </ul>

    <footer class="drawer-footer">
      <small>
        <strong>Offline-first</strong><br>
        Your data stays on this device.<br>
        <a href="#/settings">Export backup</a> to save your data.
      </small>
    </footer>
  </nav>

  <!-- Main App Container -->
  <main id="app" class="view-root" tabindex="-1" aria-live="polite"></main>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Loading Container -->
  <div id="loadingContainer"></div>

  <!-- App Script -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
